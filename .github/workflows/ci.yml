name: Heimda11 CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heimda11-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build on HP self-hosted runner
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Go format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "These files need gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -o dist/heimda11-host ./cmd/heimda11
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/heimda11-linux-amd64 ./cmd/heimda11
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/heimda11-windows-amd64.exe ./cmd/heimda11
      - uses: actions/upload-artifact@v4
        with:
          name: heimda11-${{ github.sha }}
          path: dist/
          retention-days: 14
