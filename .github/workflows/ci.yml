name: Heimda11 CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heimda11-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build on HP self-hosted runner
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Go format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "These files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Unit tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build host binary
        run: go build -trimpath -o dist/heimda11-host ./cmd/heimda11

      - name: Build Linux AMD64 release binary
        shell: bash
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/heimda11-linux-amd64 ./cmd/heimda11

      - name: Build Windows AMD64 release binary
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/heimda11-windows-amd64.exe ./cmd/heimda11

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: heimda11-${{ github.sha }}
          path: dist/
          retention-days: 14
