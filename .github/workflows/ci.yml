name: Heimda11 CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heimda11-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build on HP self-hosted runner
    runs-on: [self-hosted, heimda11]
    timeout-minutes: 20
    env:
      HEIMDA11_GO: C:\Tools\Go-1.23.12\bin\go.exe
      HEIMDA11_GOFMT: C:\Tools\Go-1.23.12\bin\gofmt.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify local Go toolchain
        shell: powershell
        run: |
          & $env:HEIMDA11_GO version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Go format check
        shell: powershell
        run: |
          & $env:HEIMDA11_GOFMT -w .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --ignore-space-at-eol --exit-code -- '*.go'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests
        shell: powershell
        run: |
          & $env:HEIMDA11_GO test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vet
        shell: powershell
        run: |
          & $env:HEIMDA11_GO vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build host binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $env:HEIMDA11_GO build -trimpath -o dist/heimda11-host.exe ./cmd/heimda11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Linux AMD64 release binary
        shell: powershell
        run: |
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          & $env:HEIMDA11_GO build -trimpath -ldflags="-s -w" -o dist/heimda11-linux-amd64 ./cmd/heimda11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows AMD64 release binary
        shell: powershell
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          & $env:HEIMDA11_GO build -trimpath -ldflags="-s -w" -o dist/heimda11-windows-amd64.exe ./cmd/heimda11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: heimda11-${{ github.sha }}
          path: dist/
          retention-days: 14
